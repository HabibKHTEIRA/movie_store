server:
  port: ${PORT:8080}

spring:
  application:
    name: cinestore-backend
  datasource:
    # Par défaut H2 persistant en local, surchargeable via SPRING_DATASOURCE_URL ou DATABASE_URL en prod
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/movies_db;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    generate-ddl: true
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      # Activé en local, désactivable en prod via SPRING_H2_CONSOLE_ENABLED=false
      enabled: ${SPRING_H2_CONSOLE_ENABLED:true}
      path: /h2-console
      settings:
        web-allow-others: true

# Configuration JWT, Admin, CORS & Rate Limiting
app:
  jwt:
    secret: ${APP_JWT_SECRET:CineStoreSuperSecretSecurityKey2026WithSufficientBitsForHMACSHA256}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000} # 24 heures
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:1234}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${APP_RATE_LIMIT_PER_MINUTE:30}
    max-concurrent-users: ${APP_MAX_CONCURRENT_USERS:10}
    user-idle-timeout-minutes: ${APP_USER_IDLE_TIMEOUT_MINUTES:5}
