server:
  port: 8080

spring:
  application:
    name: cinestore-backend
  datasource:
    # Base de données H2 persistante dans le dossier ./data du projet
    url: jdbc:h2:file:./data/movies_db;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        hbm2ddl:
          auto: update
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

# Configuration JWT & Admin
app:
  jwt:
    secret: "CineStoreSuperSecretSecurityKey2026WithSufficientBitsForHMACSHA256"
    expiration-ms: 86400000 # 24 heures
  admin:
    username: "admin"
    password: "1234"
